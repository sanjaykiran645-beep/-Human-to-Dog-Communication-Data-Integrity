<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CanineSense AI · Redirecting...</title>
    <script>
      (function() {
        var repo = "/-Human-to-Dog-Communication-Data-Integrity";
        var hasRepo = window.location.pathname.indexOf(repo) !== -1;
        var pathname = window.location.pathname || "";
        var search = window.location.search || "";
        var hash = window.location.hash || "";

        if (hasRepo) {
          pathname = pathname.replace(repo, "");
        }
        if (!pathname.startsWith("/")) {
          pathname = "/" + pathname;
        }
        if (pathname === "/" || pathname === "/index.html") {
          pathname = "";
        }

        var base = hasRepo ? repo : "";
        var dest = base + "/#" + (pathname ? pathname : "/") + search + hash;
        window.location.replace(dest);
      })();
    </script>
  </head>
  <body style="margin: 0; background: #F7F2E8; color: #382820; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div style="text-align: center; padding: 24px;">
      <h2 style="margin: 0 0 8px; font-weight: 600;">Connecting to CanineSense AI...</h2>
      <p style="margin: 0; color: #6E6256;">Redirecting to your acoustic workspace.</p>
    </div>
  </body>
</html>
